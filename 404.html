<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pagina non trovata · Mauro Testatonda</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B0B0A">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300..600&display=swap">
<style>
:root{--ink:#0B0B0A;--bone:#F0EEE8;--ash:#A9A49C;--ember:#E0612F;--ember-hi:#F2A27E}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--bone);font:300 17px/1.6 Geist,system-ui,sans-serif;display:grid;place-items:center;padding:24px;overflow:hidden}
.stage{position:relative;text-align:center;display:grid;justify-items:center;gap:22px;max-width:34rem}
.stage::before{content:"";position:absolute;left:50%;top:-40vh;width:min(520px,90vw);height:120vh;translate:-50% 0;background:linear-gradient(180deg,rgba(240,238,232,.10),rgba(240,238,232,.02) 70%,transparent);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);z-index:-1;pointer-events:none}
.stamp{display:inline-grid;place-items:center;min-width:4.4em;height:2.6em;padding:0 .8em;border:1px solid rgba(214,92,44,.6);border-radius:50%;font:400 1.4rem 'Instrument Serif',serif;color:#D65C2C;text-shadow:0 1px 0 rgba(255,255,255,.07),0 -1px 0 rgba(0,0,0,.75)}
h1{font:400 clamp(2.6rem,9vw,4.6rem)/1 'Instrument Serif',serif;letter-spacing:-.01em;margin:0}
h1 em{color:var(--ember)}
p{margin:0;color:var(--ash);max-width:30ch}
a{display:inline-flex;align-items:center;min-height:48px;padding:0 1.5rem;border:1px solid rgba(240,238,232,.24);color:var(--bone);text-decoration:none;font:500 .72rem Geist,system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;transition:background .3s,color .3s}
a:hover,a:focus-visible{background:var(--ember);border-color:var(--ember);color:var(--ink)}
a:focus-visible{outline:2px solid var(--ember-hi);outline-offset:3px}
</style>
</head>
<body>
<main class="stage">
  <span class="stamp" aria-hidden="true">404</span>
  <h1>Il palco è <em>vuoto.</em></h1>
  <p>Questa pagina non esiste o è stata spostata.</p>
  <a href="/">Torna all’inizio</a>
</main>
</body>
</html>
